<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
    <h1>Bem-vindo!</h1>

    <h2>Seus grupos</h2>
    <ul>
        {% for group in groups %}
            <li>
                <a href="{{ url_for('home.group_printers', group_id=group.id) }}">
                    {{ group.name }}
                </a>
            </li>
        {% else %}
            <li>Nenhum grupo cadastrado</li>
        {% endfor %}
    </ul>

    <h3>Cadastrar novo grupo</h3>
    <form action="{{ url_for('home.new_group') }}" method="POST">
        <input type="text" name="name" placeholder="Nome do grupo" required>
        <button type="submit">Cadastrar</button>
    </form>

    <p><a href="{{ url_for('auth.logout') }}">Logout</a></p>
</body>
</html>
